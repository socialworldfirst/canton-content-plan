<!doctype html>
<html lang="en">
<head><!--gh-guard v1 images=yes-->
<meta name="robots" content="noindex,nofollow"><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WeeKett script shuffle</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
/* Elevation: none. Nothing on this page casts a shadow. Separation is fill
   (#f7f5f7) or hairline (1px #e6e8eb), never elevation. Do not remove. */
*{box-shadow:none!important}
body{font-family:'Poppins',sans-serif;background:#fff;color:#1f2323;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
.rose{color:#ff0051}

.wrap{display:grid;grid-template-columns:216px 1fr;gap:60px;max-width:1180px;margin:0 auto;padding:0 40px 120px}
nav.side{position:sticky;top:0;align-self:start;height:100vh;padding-top:54px}
nav.side .nt{font-size:11.5px;font-weight:600;color:#9aa1a1;letter-spacing:.09em;text-transform:uppercase;margin-bottom:18px}
nav.side a{display:flex;gap:11px;font-size:13.5px;color:#69727d;padding:7px 0;line-height:1.4}
nav.side a .n{color:#c3c8cc;font-size:12px;font-variant-numeric:tabular-nums;padding-top:1px}
nav.side a:hover{color:#1f2323}
nav.side a.on{color:#ff0051;font-weight:500}
nav.side a.on .n{color:#ff0051}
nav.side img.logo{height:17px;margin-bottom:30px;display:block}

.hd{padding:54px 0 10px}
.hd .ey{font-size:12.5px;font-weight:600;color:#ff0051;letter-spacing:.07em;margin-bottom:16px}
.hd h1{font-size:clamp(34px,4.4vw,52px);font-weight:600;letter-spacing:-1.4px;line-height:1.08;margin-bottom:20px}
.hd .sub{font-size:17px;color:#5b626a;line-height:1.66;max-width:720px}
.hd .meta{margin-top:22px;font-size:13px;color:#9aa1a1;padding-top:20px;border-top:1px solid #eef0f2}

section{padding:52px 0;border-top:1px solid #eef0f2}
section:first-of-type{border-top:none}
.sn{font-size:12.5px;font-weight:600;color:#ff0051;letter-spacing:.08em;margin-bottom:13px}
h2{font-size:clamp(24px,2.7vw,33px);font-weight:600;letter-spacing:-.7px;line-height:1.16;margin-bottom:16px}
p.lead{font-size:15.5px;color:#5b626a;line-height:1.68;max-width:760px}
.note{margin-top:26px;font-size:13.5px;color:#69727d;line-height:1.65;border-left:2px solid #ff0051;padding-left:16px;max-width:760px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}
.pane{border:1px solid #e6e8eb;border-radius:16px;padding:24px 26px;box-shadow:none}
.pane h4{font-size:12.5px;font-weight:600;color:#ff0051;letter-spacing:.06em;text-transform:uppercase;margin-bottom:13px}
.pane .pp{font-size:14px;color:#5b626a;line-height:1.62;margin-bottom:15px}

.cards{display:grid;gap:18px;margin-top:28px}
.cards.c2{grid-template-columns:repeat(2,1fr)}
.card{background:#f7f5f7;border-radius:16px;padding:26px 24px;border:none;box-shadow:none}
.card .cn{font-size:12px;font-weight:600;color:#ff0051;letter-spacing:.06em;margin-bottom:10px}
.card h3{font-size:18px;font-weight:600;letter-spacing:-.3px;margin-bottom:13px}

ul.li{list-style:none}
ul.li li{position:relative;padding-left:26px;font-size:13.8px;color:#3a3f44;margin-bottom:9px;line-height:1.55}
ul.li li:last-child{margin-bottom:0}
ul.li li::before{content:"";position:absolute;left:0;top:3px;width:16px;height:16px;border-radius:50%;background:#ff0051}
ul.li li::after{content:"";position:absolute;left:4.6px;top:6px;width:4px;height:7.5px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(43deg)}

.rows{margin-top:28px;border-top:1px solid #e6e8eb}
.rows .row{display:grid;grid-template-columns:190px 1fr;gap:26px;padding:16px 0;border-bottom:1px solid #e6e8eb;align-items:start}
.rows.tight .row{padding:13px 0}
.rows .rl{font-size:14px;font-weight:600}
.rows .rl b{color:#ff0051;font-weight:600;margin-right:5px}
.rows .rv{font-size:14.5px;color:#5b626a;line-height:1.6}

.tbl{margin-top:28px;border-top:1px solid #e6e8eb}
.tr{display:grid;grid-template-columns:190px 80px 1fr;gap:20px;padding:14px 0;border-bottom:1px solid #e6e8eb;align-items:start}
.tr span:first-child{font-size:14px;font-weight:600}
.tr span:last-child{font-size:14px;color:#5b626a;line-height:1.58}
.tr.th span{font-size:11.5px;font-weight:600;color:#9aa1a1;letter-spacing:.07em;text-transform:uppercase}
.fx{font-size:13px;color:#9aa1a1;font-weight:500}
.tl{font-size:13px;color:#ff0051;font-weight:600}

.copyblock{margin-top:26px;border:1px solid #e6e8eb;border-radius:14px;overflow:hidden;max-width:760px}
.cbh{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid #eef0f2}
.cbh span{font-size:12.5px;font-weight:600;color:#69727d}
.cpy{font-family:'Poppins';font-size:12.5px;font-weight:500;color:#ff0051;background:#fff;border:1.5px solid #ff0051;border-radius:999px;padding:5px 15px;cursor:pointer}
.cpy:hover{background:#ff0051;color:#fff}
pre{font-family:'Poppins';font-size:13.5px;color:#3a3f44;line-height:1.85;padding:18px;white-space:pre-wrap}

.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.links a{border:1.5px solid #ff0051;color:#ff0051;border-radius:999px;padding:10px 22px;font-size:14px;font-weight:500}
.links a:hover{background:#ff0051;color:#fff}

.lockw{max-width:1180px;margin:0 auto;padding:0 40px 50px;font-size:12px;color:#c3c8cc}
.lockw a{border-bottom:1px solid #e6e8eb}

@media(max-width:940px){
 .wrap{grid-template-columns:1fr;gap:0;padding:0 24px 90px}
 nav.side{display:none}
 .two,.cards.c2{grid-template-columns:1fr}
 .rows .row,.tr{grid-template-columns:1fr;gap:5px}
 .tr span:last-child{margin-top:2px}
}

.wrap{grid-template-columns:1fr;max-width:1440px;gap:0;padding:0 32px 120px}
.hd{padding:40px 0 8px}.hd .sub{max-width:820px}.meta{display:flex;gap:22px;flex-wrap:wrap}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e6e8eb;padding:12px 0;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.bar .rt{font-size:24px;font-weight:600;letter-spacing:-.5px;font-variant-numeric:tabular-nums;min-width:90px}
.bar .meter{flex:1;min-width:160px;max-width:420px;height:6px;background:#f7f5f7;border-radius:999px;position:relative;overflow:hidden;display:flex}
.bar .meter i{display:block;height:100%;background:var(--c,#1f2323);transition:width .2s}
.bar .meter b{position:absolute;top:0;bottom:0;width:1px;background:#c3c8cc}
.bar .st{font-size:12.5px;font-weight:500;color:#69727d}.bar.ok .st{color:#ff0051}.bar.over .st{color:#1f2323}
.bar .cnt{font-size:12.5px;color:#9aa1a1}
.bar .acts{margin-left:auto;display:flex;gap:8px}
.btn{font:inherit;font-size:12.5px;font-weight:500;border:1px solid #e6e8eb;background:#fff;color:#1f2323;border-radius:999px;padding:6px 13px;cursor:pointer;line-height:1.2}
.btn:hover{border-color:#1f2323}.btn.pri{background:#ff0051;border-color:#ff0051;color:#fff}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:36px;margin-top:22px;align-items:start}
.col .ch{position:sticky;top:62px;background:#fff;z-index:4;padding:10px 0 12px;border-bottom:1px solid #e6e8eb}
.col h2{font-size:20px;letter-spacing:-.4px;margin:0}.col .lead{font-size:13px;color:#69727d;margin-top:6px;line-height:1.55}
.s-hook{--c:#ff0051}.s-intro{--c:#7a4bff}.s-who{--c:#ff8a00}.s-what{--c:#0ea5a4}.s-scale{--c:#2f80ed}.s-why{--c:#9c27b0}.s-challenge{--c:#e53935}.s-turn{--c:#d81b60}.s-how{--c:#00897b}.s-result{--c:#43a047}.s-close{--c:#6d4c41}.s-end{--c:#455a64}
.sec{margin-top:16px;border-left:3px solid var(--c);border-radius:0 8px 8px 0;background:color-mix(in srgb,var(--c) 5%,#fff);padding:0 0 6px 0}
.sec.hot{background:color-mix(in srgb,var(--c) 12%,#fff)}
.sec .sh{display:flex;align-items:baseline;gap:10px;padding:9px 14px 6px;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--c)}
.sec .sh .t{margin-left:auto;font-weight:500;letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums;color:#69727d}
.sec .sh .add{font-weight:500;letter-spacing:0;text-transform:none;color:#9aa1a1;cursor:pointer;font-size:12px}.sec .sh .add:hover{color:var(--c)}
.sec .zone{min-height:30px;padding:0 14px}
.sec .zone:empty::after{content:'drop here';display:block;font-size:12px;color:#c3c8cc;padding:6px 0 10px}
.card{display:grid;grid-template-columns:22px 1fr;gap:9px;padding:11px 0;border-top:1px solid color-mix(in srgb,var(--c) 18%,#fff);position:relative;cursor:grab}
.card:active{cursor:grabbing}.card:first-child{border-top:0}
.card.drag{opacity:.3}.card.over{border-top:2px solid var(--c)}
.card .h{color:#c3c8cc;font-size:16px;line-height:1;padding-top:2px;user-select:none;text-align:center}
.card .k{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:11.5px;color:#69727d}
.card .k .num{font-size:13px;font-weight:600;color:#1f2323;font-variant-numeric:tabular-nums}
.card .k .was,.card .k .from{color:var(--c);font-weight:500}
.card .k .secs{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:500;color:#1f2323}
.card .l{font-size:14.5px;line-height:1.55;margin-top:4px;outline:none;border-radius:4px;padding:1px 3px;margin-left:-3px}
.card .l:focus{background:#fff;box-shadow:none;outline:1px solid var(--c)}
.card .l s{color:#b0b6ba;text-decoration-color:#e53935}
.card .l.edited{}.card .k .ed{color:#9aa1a1}
.card .pic,.card .flag{font-size:12px;color:#69727d;line-height:1.5;margin-top:4px}
.card .pic b{color:#1f2323;font-weight:500}.card .flag b{color:#e53935;font-weight:500}
.card .ops{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;align-items:center}
.card .ops .btn{padding:3px 9px;font-size:11.5px;background:transparent}
.card textarea{display:none;width:100%;margin-top:8px;font:inherit;font-size:13px;line-height:1.5;padding:8px 10px;border:1px solid #e6e8eb;border-radius:8px;background:#fff;resize:vertical;min-height:52px}
.card textarea.on{display:block}
.card.off .l,.card.off .pic{color:#9aa1a1}.card.off .l{text-decoration:line-through;text-decoration-color:#c3c8cc}
.card.graphic .l{font-style:italic;color:#5b626a}.card.graphic .l[contenteditable]{font-style:normal}
.outs{margin-top:50px;max-width:900px}.outs h2{font-size:20px}
.orow{display:grid;grid-template-columns:1fr 1fr 150px;gap:12px;padding:9px 0;border-top:1px solid #e6e8eb;font-size:13px}
.orow b{font-weight:500}.orow span{color:#69727d}.orow em{font-style:normal;color:#9aa1a1;font-variant-numeric:tabular-nums}
.gn{margin-top:44px;max-width:900px}.gn h2{font-size:20px}
.gn textarea{width:100%;font:inherit;font-size:14px;line-height:1.55;padding:11px 13px;border:1px solid #e6e8eb;border-radius:8px;background:#f7f5f7;min-height:90px;resize:vertical;margin-top:12px}
.copyblock pre{white-space:pre-wrap;max-height:420px;overflow:auto}
.small{font-size:12.5px;color:#69727d;line-height:1.6;margin-top:10px}
@media(max-width:900px){.cols{grid-template-columns:1fr}.col .ch{position:static}.orow{grid-template-columns:1fr}.bar .acts{margin-left:0}}
</style>

#gate-err{min-height:16px;margin-top:9px;font-size:12px;color:#c0392b}

.gate-lock{position:fixed;right:12px;bottom:10px;z-index:9998;font:11px

<script>
(function(){
  var KEY='gate:'+location.pathname;
  function b2b(b64){var s=atob(b64),a=new Uint8Array(s.length);
    for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
  async function derive(pw,salt,it){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),
      'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:it,
      hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  }
  async function decrypt(pw){
    var b=JSON.parse(document.getElementById('gate-payload').textContent);
    var k=await derive(pw,b2b(b.salt),b.iterations);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2b(b.iv)},k,
      b2b(b.ciphertext));
    return new TextDecoder().decode(plain);
  }
  function runScripts(root){
    root.querySelectorAll('script').forEach(function(old){
      var s=document.createElement('script');
      for(var i=0;i<old.attributes.length;i++){
        s.setAttribute(old.attributes[i].name,old.attributes[i].value);
      }
      s.textContent=old.textContent;
      old.parentNode.replaceChild(s,old);
    });
  }
  function reveal(html){
    var c=document.getElementById('gate-content');
    c.innerHTML=html; c.hidden=false;
    var g=document.getElementById('gate'); if(g) g.remove();
    document.body.classList.remove('gate-locked');
    runScripts(c);
    var lock=document.createElement('div');
    lock.className='gate-lock'; lock.textContent='lock device';
    lock.onclick=function(){localStorage.removeItem(KEY);location.reload();};
    document.body.appendChild(lock);
    window.dispatchEvent(new Event('gate:unlocked'));
    try{window.dispatchEvent(new Event('resize'));}catch(e){}
  }
  window.gateSubmit=async function(e){
    e.preventDefault();
    var inp=document.getElementById('gate-input');
    var err=document.getElementById('gate-err');
    err.textContent='';
    try{
      var html=await decrypt(inp.value);
      localStorage.setItem(KEY,inp.value);
      reveal(html);
    }catch(_){ err.textContent='Wrong password.'; inp.select(); }
    return false;
  };
  document.addEventListener('DOMContentLoaded',async function(){
    var saved=localStorage.getItem(KEY);
    if(!saved) return;
    try{ reveal(await decrypt(saved)); }
    catch(_){ localStorage.removeItem(KEY); }
  });
})();
</script>
