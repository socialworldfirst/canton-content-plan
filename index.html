<script>
(function(){
  var KEY='gate:'+location.pathname;
  function b2b(b64){var s=atob(b64),a=new Uint8Array(s.length);
    for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
  async function derive(pw,salt,it){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),
      'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:it,
      hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  }
  async function decrypt(pw){
    var b=JSON.parse(document.getElementById('gate-payload').textContent);
    var k=await derive(pw,b2b(b.salt),b.iterations);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2b(b.iv)},k,
      b2b(b.ciphertext));
    return new TextDecoder().decode(plain);
  }
  function runScripts(root){
    root.querySelectorAll('script').forEach(function(old){
      var s=document.createElement('script');
      for(var i=0;i<old.attributes.length;i++){
        s.setAttribute(old.attributes[i].name,old.attributes[i].value);
      }
      s.textContent=old.textContent;
      old.parentNode.replaceChild(s,old);
    });
  }
  function reveal(html){
    var c=document.getElementById('gate-content');
    c.innerHTML=html; c.hidden=false;
    var g=document.getElementById('gate'); if(g) g.remove();
    document.body.classList.remove('gate-locked');
    runScripts(c);
    var lock=document.createElement('div');
    lock.className='gate-lock'; lock.textContent='lock device';
    lock.onclick=function(){localStorage.removeItem(KEY);location.reload();};
    document.body.appendChild(lock);
    window.dispatchEvent(new Event('gate:unlocked'));
    try{window.dispatchEvent(new Event('resize'));}catch(e){}
  }
  window.gateSubmit=async function(e){
    e.preventDefault();
    var inp=document.getElementById('gate-input');
    var err=document.getElementById('gate-err');
    err.textContent='';
    try{
      var html=await decrypt(inp.value);
      localStorage.setItem(KEY,inp.value);
      reveal(html);
    }catch(_){ err.textContent='Wrong password.'; inp.select(); }
    return false;
  };
  document.addEventListener('DOMContentLoaded',async function(){
    var saved=localStorage.getItem(KEY);
    if(!saved) return;
    try{ reveal(await decrypt(saved)); }
    catch(_){ localStorage.removeItem(KEY); }
  });
})();
</script>
